[package]
name = "octopus"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false

# Independent from the umbrella proxy workspace; runtime cutover remains gated.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value", "preserve_order"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
md-5 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
postgres-openssl = "0.5"
openssl = "0.10"
rdkafka = { version = "0.36", features = ["tokio", "cmake-build"] }
futures-util = "0.3"
bigdecimal = "0.4"
regex = "1"
rustix = { version = "1", features = ["fs"] }
fancy-regex = "0.19"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
idna = "1.1"
unicode-normalization = "0.1"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-client", "reqwest-rustls"] }
tracing-opentelemetry = "0.32"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
